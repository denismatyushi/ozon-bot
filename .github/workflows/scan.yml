name: Price Anomaly Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install aiohttp aiogram pydantic pydantic-settings aiosqlite "apscheduler>=3.10,<4.0" python-dotenv playwright "curl_cffi>=0.7" "selectolax>=0.3"
          playwright install --with-deps chromium

      - name: Proxy pre-flight diagnostic
        env:
          OZON_PROXY_URL: ${{ secrets.OZON_PROXY_URL }}
        run: |
          if [ -z "$OZON_PROXY_URL" ]; then
            echo "No OZON_PROXY_URL set — will run without proxy"
            exit 0
          fi
          # Extract scheme://host:port/credentials without echoing creds
          python - <<'PY'
          import os, socket, urllib.parse
          url = os.environ["OZON_PROXY_URL"]
          p = urllib.parse.urlparse(url)
          host, port = p.hostname, p.port
          print(f"Proxy scheme: {p.scheme}")
          print(f"Proxy host: {host}")
          print(f"Proxy port: {port}")
          print(f"Proxy has auth: {bool(p.username)}")
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.settimeout(6)
          try:
              s.connect((host, port))
              print("TCP connect: OK — proxy is reachable from runner")
          except Exception as e:
              print(f"TCP connect FAILED: {type(e).__name__}: {e}")
              print("→ This is why Playwright throws ERR_PROXY_CONNECTION_FAILED.")
              print("→ Either the proxy is offline, or it whitelists by IP and this runner is not whitelisted.")
          finally:
              s.close()
          PY
          # Bonus: try HTTP CONNECT to google.com via the proxy using curl
          echo "--- curl test via proxy (HTTPS CONNECT to google.com) ---"
          curl -sS --max-time 10 -x "$OZON_PROXY_URL" -o /dev/null -w "HTTP %{http_code}  connect=%{time_connect}s  total=%{time_total}s\n" https://www.google.com/generate_204 || echo "curl via proxy FAILED"

      - name: Tune TCP/IP stack to look like Windows desktop (point #11)
        run: |
          # Windows-like TTL (128) and TCP window scaling so passive OS fingerprinting matches UA
          sudo sysctl -w net.ipv4.ip_default_ttl=128 || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_timestamps=1 || true
          sudo sysctl -w net.ipv4.tcp_sack=1 || true
          ip link show | head -20 || true

      - name: Restore price history DB
        uses: actions/cache@v4
        with:
          path: data/prices.db
          key: price-db-${{ github.run_id }}
          restore-keys: price-db-

      - name: Verify setup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== Checking secrets ==="
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is EMPTY. Go to repo Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_CHAT_ID is EMPTY. Go to repo Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "Secrets OK"

          echo "=== Checking Python imports ==="
          python -c "
          import sys
          print(f'Python: {sys.version}')
          print(f'Working dir: {__import__(\"os\").getcwd()}')
          print(f'Files: {__import__(\"os\").listdir(\".\")[:20]}')

          # Test imports one by one
          try:
              from config.settings import Settings
              print('config.settings: OK')
          except Exception as e:
              print(f'config.settings FAILED: {e}')
              sys.exit(1)

          try:
              from src.models.product import Product
              print('src.models: OK')
          except Exception as e:
              print(f'src.models FAILED: {e}')
              sys.exit(1)

          try:
              from src.parsers.wildberries import WildberriesParser
              print('src.parsers.wildberries: OK')
          except Exception as e:
              print(f'src.parsers.wildberries FAILED: {e}')
              sys.exit(1)

          try:
              from src.parsers.ozon import OzonParser
              print('src.parsers.ozon: OK')
          except Exception as e:
              print(f'src.parsers.ozon FAILED: {e}')
              sys.exit(1)

          try:
              from src.anomaly.detector import AnomalyDetector
              print('src.anomaly.detector: OK')
          except Exception as e:
              print(f'src.anomaly.detector FAILED: {e}')
              sys.exit(1)

          try:
              from src.notifier.telegram import TelegramNotifier
              print('src.notifier.telegram: OK')
          except Exception as e:
              print(f'src.notifier.telegram FAILED: {e}')
              sys.exit(1)

          try:
              from src.storage.db import Database
              print('src.storage.db: OK')
          except Exception as e:
              print(f'src.storage.db FAILED: {e}')
              sys.exit(1)

          # Test creating Settings with env vars
          import os
          s = Settings()
          print(f'Token starts with: {s.TELEGRAM_BOT_TOKEN[:8]}...')
          print(f'Chat ID: {s.TELEGRAM_CHAT_ID}')
          print()
          print('=== ALL CHECKS PASSED ===')
          "

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OZON_PROXY_URL: ${{ secrets.OZON_PROXY_URL }}
          ANOMALY_THRESHOLD_PERCENT: "60"
          LOG_LEVEL: "INFO"
        run: python -m src.main --once
