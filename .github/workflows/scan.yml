name: Price Anomaly Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install aiohttp aiogram pydantic pydantic-settings aiosqlite "apscheduler>=3.10,<4.0" python-dotenv playwright
          playwright install --with-deps chromium

      - name: Restore price history DB
        uses: actions/cache@v4
        with:
          path: data/prices.db
          key: price-db-${{ github.run_id }}
          restore-keys: price-db-

      - name: Verify setup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== Checking secrets ==="
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is EMPTY. Go to repo Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_CHAT_ID is EMPTY. Go to repo Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "Secrets OK"

          echo "=== Checking Python imports ==="
          python -c "
          import sys
          print(f'Python: {sys.version}')
          print(f'Working dir: {__import__(\"os\").getcwd()}')
          print(f'Files: {__import__(\"os\").listdir(\".\")[:20]}')

          # Test imports one by one
          try:
              from config.settings import Settings
              print('config.settings: OK')
          except Exception as e:
              print(f'config.settings FAILED: {e}')
              sys.exit(1)

          try:
              from src.models.product import Product
              print('src.models: OK')
          except Exception as e:
              print(f'src.models FAILED: {e}')
              sys.exit(1)

          try:
              from src.parsers.wildberries import WildberriesParser
              print('src.parsers.wildberries: OK')
          except Exception as e:
              print(f'src.parsers.wildberries FAILED: {e}')
              sys.exit(1)

          try:
              from src.parsers.ozon import OzonParser
              print('src.parsers.ozon: OK')
          except Exception as e:
              print(f'src.parsers.ozon FAILED: {e}')
              sys.exit(1)

          try:
              from src.anomaly.detector import AnomalyDetector
              print('src.anomaly.detector: OK')
          except Exception as e:
              print(f'src.anomaly.detector FAILED: {e}')
              sys.exit(1)

          try:
              from src.notifier.telegram import TelegramNotifier
              print('src.notifier.telegram: OK')
          except Exception as e:
              print(f'src.notifier.telegram FAILED: {e}')
              sys.exit(1)

          try:
              from src.storage.db import Database
              print('src.storage.db: OK')
          except Exception as e:
              print(f'src.storage.db FAILED: {e}')
              sys.exit(1)

          # Test creating Settings with env vars
          import os
          s = Settings()
          print(f'Token starts with: {s.TELEGRAM_BOT_TOKEN[:8]}...')
          print(f'Chat ID: {s.TELEGRAM_CHAT_ID}')
          print()
          print('=== ALL CHECKS PASSED ===')
          "

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANOMALY_THRESHOLD_PERCENT: "60"
          LOG_LEVEL: "INFO"
        run: python -m src.main --once
