[project]
name = "english-school-bot"
version = "0.1.0"
description = "Telegram bot that teaches English from scratch, designed like a professional school"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4",
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.19",
    "apscheduler>=3.10,<4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]
