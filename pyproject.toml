[project]
name = "marketplace-anomaly-bot"
version = "0.1.0"
description = "Price anomaly detector for Ozon and Wildberries marketplaces"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "aiogram>=3.4",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.19",
    "apscheduler>=3.10,<4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ozon = [
    "playwright>=1.40",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]
